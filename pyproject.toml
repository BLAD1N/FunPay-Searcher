[project]
name = "funpay-searcher"
version = "0.1.0"
description = "Поиск игровых аккаунтов на FunPay/Lolzteam и автоматическое создание лотов на FunPay"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# RUF001-003: кириллица в строках/комментариях — намеренно.
# UP042: переход на StrEnum меняет str()/format() членов перечислений — поведение оставляем прежним.
ignore = ["RUF001", "RUF002", "RUF003", "UP042"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
