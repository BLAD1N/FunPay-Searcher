<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>FunPay Searcher</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b8def'/%3E%3Ccircle cx='14' cy='14' r='6.5' fill='none' stroke='%23fff' stroke-width='3'/%3E%3Cpath d='M19 19l6 6' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="app" class="app">
    <!-- Левая панель навигации -->
    <aside class="sidebar" id="sidebar" aria-label="Навигация">
      <div class="brand">
        <span class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="28" height="28"><rect width="32" height="32" rx="8" fill="currentColor" opacity=".18"/><circle cx="14" cy="14" r="6.5" fill="none" stroke="currentColor" stroke-width="3"/><path d="M19 19l6 6" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
        </span>
        <span class="brand-name" id="brand-name">FunPay Searcher</span>
      </div>

      <nav class="nav" id="nav">
        <a class="nav-item" href="#/dashboard" data-route="dashboard">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>
          </span>
          <span class="nav-label">Панель</span>
        </a>
        <a class="nav-item" href="#/found" data-route="found">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          </span>
          <span class="nav-label">Найдено</span>
          <span class="nav-badge" id="badge-candidates" hidden>0</span>
        </a>
        <a class="nav-item" href="#/lots" data-route="lots">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M20 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>
          </span>
          <span class="nav-label">Лоты</span>
          <span class="nav-badge" id="badge-lots" hidden>0</span>
        </a>
        <a class="nav-item" href="#/orders" data-route="orders">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M6 2h12l1 5H5z"/><path d="M5 7v13a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7"/><path d="M9 11h6M9 15h4"/></svg>
          </span>
          <span class="nav-label">Продажи</span>
          <span class="nav-badge" id="badge-orders" hidden>0</span>
        </a>
        <a class="nav-item" href="#/chat" data-route="chat">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-8 8H8l-5 3 1.2-4.2A8 8 0 1 1 21 12z"/><path d="M8 11h8M8 14h5"/></svg>
          </span>
          <span class="nav-label">Чаты</span>
          <span class="nav-badge" id="badge-chats" hidden>0</span>
        </a>
        <a class="nav-item" href="#/profiles" data-route="profiles">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h6"/><circle cx="18" cy="17" r="3"/></svg>
          </span>
          <span class="nav-label">Профили</span>
        </a>
        <a class="nav-item" href="#/settings" data-route="settings">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
          </span>
          <span class="nav-label">Настройки</span>
        </a>
        <a class="nav-item" href="#/log" data-route="log">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>
          </span>
          <span class="nav-label">Журнал</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="conn-list" aria-label="Подключения">
          <div class="conn" id="conn-funpay" title="FunPay: нет данных">
            <span class="conn-dot" aria-hidden="true"></span>
            <span class="conn-name">FunPay</span>
            <span class="conn-user" id="conn-funpay-user"></span>
          </div>
          <div class="conn" id="conn-lolz" title="Lolz: нет данных">
            <span class="conn-dot" aria-hidden="true"></span>
            <span class="conn-name">Lolz</span>
            <span class="conn-user" id="conn-lolz-user"></span>
          </div>
          <div class="conn" id="conn-telegram" title="Telegram: нет данных">
            <span class="conn-dot" aria-hidden="true"></span>
            <span class="conn-name">Telegram</span>
            <span class="conn-user" id="conn-telegram-user"></span>
          </div>
          <div class="conn" id="conn-autoreply" title="Автоответчик: нет данных">
            <span class="conn-dot" aria-hidden="true"></span>
            <span class="conn-name">Автоответчик</span>
            <span class="conn-user" id="conn-autoreply-user"></span>
          </div>
        </div>
        <div class="version muted" id="app-version"></div>
      </div>
    </aside>

    <!-- Основная область -->
    <main class="main" id="main" tabindex="-1">
      <div class="page-loading"><span class="spinner" aria-hidden="true"></span> Загрузка…</div>
    </main>
  </div>

  <!-- Уведомления -->
  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>

  <!-- Модальные окна -->
  <div id="modal-root"></div>

  <script src="/static/app.js"></script>
</body>
</html>
