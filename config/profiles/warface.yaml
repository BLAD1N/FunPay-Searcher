# ============================================================================
#  Профиль поиска: Warface — донатные аккаунты с высоким рангом, золотым и вечным оружием
#  Подробные комментарии к каждому полю — в wot_ru_tops.yaml, полный шаблон
#  со всеми опциями — any_game_cheap_tops.yaml.
# ============================================================================
id: warface
name: "Warface — донат, ранг, золотое оружие"
game: warface
region: null                     # RU (VK Play / My.Games) или международный — ограничьте через regions при необходимости
enabled: false
description: >-
  Аккаунты Warface (ПК) с рангом 50–90, золотым и вечным оружием, большим донатом,
  редкими наборами и VIP.

sources:
  funpay:
    enabled: true
    subcategory_id: null
    subcategory_ids: []
    game_query: "Warface"
    subcategory_query: "Аккаунты"
    server_filter: []
    extra_query: {}
    max_items: 500
  lolz:
    enabled: true
    category: warface
    params:
      order_by: price_to_up        # документированный параметр
      # rank_min: 50               # минимальный ранг — проверьте через Параметры
    pages: 3
    max_items: 500

criteria:
  price:
    min: 500
    max: 20000
  # «аккаунт», «скины», «оружие» не пишем. Маркеры: ранг, донат, золотое/вечное оружие, VIP.
  must_any:
    - "Ранг => 90 ранг*|ранг 90|90 rank|rank 90|85 ранг*|ранг 85|80 ранг*|ранг 80|75 ранг*|ранг 75|70 ранг*|ранг 70|65 ранг*|ранг 65|60 ранг*|ранг 60|55 ранг*|ранг 55|50 ранг*|ранг 50|максимальн* ранг*|макс ранг|90 лвл|lvl 90|90 lvl"
    - "Донат => донат*|donate*|donat*|задонач*|вложен*|влито|вложено|закинуто"
    - "Золотое оружие => золот* оружи*|золот* пушк*|golden weapon*|gold weapon*|голд* пушк*|золотой ак|золотая|золотых|золотые"
    - "Вечное оружие => вечн* оружи*|вечн* пушк*|навсегда|permanent weapon*|вечка|вечки|вечных|вечные"
    - "Все пушки => все пушки|все оружие|all weapons|все скины|all skins|фулл оруж*"
    - "VIP => vip|вип"
    - "Редкие наборы => наборы|набор оружия|набор* эпох*|наборы эпох|сеты|sets|коллекционн*|collector*|легендар*|legendary"
    - "Кредиты => кредит*|credits|варбакс*|warbucks"
  must_all: []
  exclude:
    - "забанен*|заблокирован*|banned|в бане|есть бан|стоит бан|словил бан|получил бан|с баном|пермабан|перма бан|permanent* ban*|perma ban"
    - "без почты|без доступа к почте|почта не выдается|почта не дается|без привязки почты|без привязки к почте|почта не привязана|no email|without email|no mail access|без my games|без доступа к my games|my games не выда*|без майгеймс|без мейл ру|mail.ru не выда*|без vk play|без доступа к vk play|vk play не выда*"
    - "аренда|в аренду|арендовать|прокат|rent|rental|for rent|временн* доступ*|временн* аккаунт*|временное пользование|temporary access"
    - "только обмен|на обмен|обменяю|меняю на|обмен на|trade only|for trade|swap only"
    - "буст|бустинг|boost|boosting|boosted|прокачаю|прокачка на заказ|накрутк*|услуг* прокачк*|подниму ранг|ранг на заказ|рм на заказ"
    - "warface mobile|wf mobile|мобайл|mobile|ps4|ps5|xbox|playstation|консольн*|console|nintendo"   # мобильная/консольная версия
    - "кредиты по курсу|кредитов по курсу|продам кредит*|пополнение|top up|топ ап|промокод*|promo code*|пин-код|pin-код|пин код"   # продажа валюты/кодов
    - "cheat*|чит|читы|читами|читом|hack*|хак|хакнут*|софт|aimbot|аимбот|вх"
  # Хотя бы одно: ранг от 50 («75 ранг», «ранг: 90», «rank 60») или донат/золотое/вечное оружие.
  regex_any:
    - '(?<!\d)([5-9]\d)\s*\+?\s*(ранг|rank|лвл|lvl|уровн)'
    - '(ранг|rank|лвл|lvl|уровень)\s*[:\-–—]?\s*([5-9]\d)(?!\d)'
    - 'донат|donat|влито|вложен|золот\w* (оружи|пушк)|golden|вечн\w* (оружи|пушк)|вечк|навсегда|permanent'
  regex_exclude: []
  numeric: []
  # numeric:
  #   - {field: rank, min: 50}            # проверьте имя поля через attributes["raw_keys"]
  highlights:
    - "Ранг 90 => 90 ранг*|ранг 90|90 rank|rank 90|максимальн* ранг*|макс ранг|90 лвл|lvl 90|90 lvl"
    - "Ранг 80+ => 85 ранг*|ранг 85|80 ранг*|ранг 80|80 rank|rank 80|85 rank|rank 85"
    - "Ранг 70+ => 75 ранг*|ранг 75|70 ранг*|ранг 70|70 rank|rank 70|75 rank|rank 75"
    - "Ранг 50+ => 65 ранг*|ранг 65|60 ранг*|ранг 60|55 ранг*|ранг 55|50 ранг*|ранг 50|rank 50|rank 55|rank 60|rank 65"
    - "Донат => донат*|donate*|donat*|задонач*|вложен*|влито|вложено|закинуто"
    - "Золотое оружие => золот* оружи*|золот* пушк*|golden weapon*|gold weapon*|голд* пушк*|золотой ак|золотая|золотых|золотые"
    - "Вечное оружие => вечн* оружи*|вечн* пушк*|навсегда|permanent weapon*|вечка|вечки|вечных|вечные"
    - "Все пушки => все пушки|все оружие|all weapons|все скины|all skins|фулл оруж*"
    - "VIP => vip|вип"
    - "Редкие наборы => наборы|набор оружия|набор* эпох*|наборы эпох|сеты|sets|коллекционн*|collector*|легендар*|legendary"
    - "Кредиты => кредит*|credits|варбакс*|warbucks"
    - "Коробки удачи => короб* удачи|коробки|boxes|ящик*"
    - "Полный доступ => полный доступ|full access|родная почта|native mail|native email|первая почта"
  regions: []
  min_score: 1.0
  seller_min_reviews: null

pricing:
  mode: tiers
  formula: "price * 2 - 1000"
  percent: 80.0
  multiplier: 1.9
  tiers:
    - {up_to: 2000, percent: 150}
    - {up_to: 10000, percent: 100}
    - {up_to: 20000, percent: 80}
  min_margin: 500
  round_to: 50
  round_mode: nearest
  price_ending: null

lot_template:
  funpay_subcategory_id: null
  title_ru: "🎖 {game} | {highlights} | Полный доступ, смена почты"
  title_en: "🎖 {game} account | {highlights} | Full access"
  description_ru: |
    🎖 {game} — донатный аккаунт
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    📦 Что внутри:
    {highlights_lines}

    🛡 Гарантии магазина:
    ✔ Аккаунт проверяется перед передачей покупателю
    ✔ Полный доступ — меняете пароль и привязываете свою почту
    ✔ Помогаем с первым входом и сменой данных
    ✔ Сделка через FunPay — деньги под защитой площадки

    🚚 Доставка:
    • Регион: {region}
    • Выдача данных в чате после оплаты, обычно 10–60 минут
    • Скриншоты арсенала, ранга и статистики — по запросу в чате

    💬 Напишите перед покупкой — подтвердим наличие и ответим на вопросы!
  description_en: ""
  amount: 1
  deactivate_after_sale: true
  active: true
  fields: {}

examples:
  positive:
    - "Warface аккаунт 85 ранг, вечное золотое оружие, влито 50к, VIP"
    - "Варфейс 90 ранг, все пушки навсегда, наборы эпох, родная почта"
    - "Warface account rank 70, donated 300$, golden weapons, credits"
  negative:
    - "Warface 20 ранг, стандартное оружие"
    - "Warface 90 ранг, золотое оружие — аккаунт забанен"
    - "Warface Mobile аккаунт, 60 ранг, донат"
    - "Подниму ранг Warface до 90 — буст"
    - "Warface 80 ранг в аренду на день"
    - "Кредиты Warface по курсу, пополнение"
    - "Warface 75 ранг, вечное оружие, без доступа к VK Play"
