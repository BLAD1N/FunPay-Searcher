  positive:
    - "WoT ASIA account, all tier 10, Chieftain, Kranvagn, no ban"
    - "Продам акк WoT Азия, все топы, Об. 279 (р), Carro 45t, E 100, 15к gold"
    - "World of Tanks ASIA collector account: all lines researched, Object 907, 121B, M60"
  negative:
    - "WoT ASIA account, all tier 10, Chieftain, VAC — account is banned"
