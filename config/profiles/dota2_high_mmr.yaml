# ============================================================================
#  Профиль поиска: Dota 2 — аккаунты с высоким MMR
#  Подробные комментарии к каждому полю — в wot_ru_tops.yaml.
# ============================================================================
id: dota2_high_mmr
name: "Dota 2 — высокий MMR (6000+)"
game: dota2
region: null                     # Dota 2 — регион не важен
enabled: true
description: >-
  Steam-аккаунты с Dota 2: рейтинг 6000+ MMR, Immortal/Divine, редкие Arcana.

sources:
  funpay:
    enabled: true
    subcategory_id: null
    subcategory_ids: []
    game_query: "Dota 2"
    subcategory_query: "Аккаунты"
    server_filter: []
    extra_query: {}
    max_items: 500
  lolz:
    enabled: true
    category: steam
    # Имена параметров Steam-категории (game, dota2_solo_mmr_min и т.п.) обязательно
    # проверьте в UI -> «Lolz» -> «Параметры» для категории steam — они могут отличаться.
    params:
      game: [570]                  # 570 — AppID Dota 2 (ищем аккаунты с этой игрой)
      order_by: price_to_up
      dota2_solo_mmr_min: 6000     # минимальный рейтинг (имя параметра — см. выше)
      # pmin: 3000
      # pmax: 80000
    pages: 3
    max_items: 500

criteria:
  price:
    min: 2000
    max: 80000
  must_any:
    - "MMR => mmr|ммр|мммр|рейтинг|rating"
    - "Immortal => immortal|имморт*|бессмерт*"
    - "Divine => divine|дивайн|божеств*"
    - "Arcana => аркан*|arcana*"
    - "Titan => titan|титан"
  must_all: []
  exclude:
    - "бан|ban|banned|забанен*|заблокирован*|vac"
    - "без почты|без доступа к почте|no email"
    - "буст*|boost*|калибровк*|calibration"       # услуги буста, а не аккаунты
    - "обмен|только обмен|trade only"
    - "low prior*|лоу прайор*|лп|лоу приор*"
  # Хотя бы одно: в тексте должен быть числовой MMR от 1000 (4–5 цифр) рядом со словом mmr/ммр.
  regex_any:
    - "(?<!\\d)(\\d{4,5})\\s*(\\+)?\\s*(mmr|ммр)"
    - "(mmr|ммр)\\s*[:\\-–—]?\\s*(\\d{4,5})"
  regex_exclude: []
  # Если источник отдаёт MMR отдельным полем (например, dota2_solo_mmr у Lolz) —
  # можно отфильтровать точнее. Отсутствующее поле объявление не отклоняет.
  numeric: []
  # numeric:
  #   - {field: dota2_solo_mmr, min: 6000}
  highlights:
    - "Immortal => immortal|имморт*|бессмерт*"
    - "Divine => divine|дивайн"
    - "Arcana => аркан*|arcana*"
    - "Titan => titan|титан"
    - "Battle Pass => battle pass|батл пасс|батлпасс|бп"
    - "Dota Plus => dota plus|дота плюс"
    - "Prime => prime|прайм"
    - "Первый владелец => первый владелец|first owner|первовлад*"
    - "Родная почта => родная почта|native mail|native email|полный доступ|full access"
  regions: []
  min_score: 1.0
  seller_min_reviews: null

pricing:
  mode: formula
  formula: "price * 2 - 1000"
  percent: 90.0
  multiplier: 1.9
  tiers: []
  min_margin: 2000
  round_to: 100
  round_mode: nearest
  price_ending: null

lot_template:
  funpay_subcategory_id: null
  title_ru: ""
  title_en: ""
  description_ru: ""
  description_en: ""
  amount: 1
  deactivate_after_sale: true
  active: true
  fields: {}
