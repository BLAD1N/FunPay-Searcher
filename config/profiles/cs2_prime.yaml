# ============================================================================
#  Профиль поиска: Counter-Strike 2 — аккаунты с Prime, FACEIT, инвентарём
#  Подробные комментарии к каждому полю — в wot_ru_tops.yaml.
# ============================================================================
id: cs2_prime
name: "CS2 — Prime / FACEIT / инвентарь"
game: cs2
region: null
enabled: true
description: >-
  Steam-аккаунты с CS2: Prime-статус, высокий ранг/FACEIT, ножи, перчатки,
  ценный инвентарь и медали.

sources:
  funpay:
    enabled: true
    subcategory_id: null
    subcategory_ids: []
    game_query: "Counter-Strike 2"   # на FunPay игра может называться «CS2» — проверьте в UI -> «Категории»
    subcategory_query: "Аккаунты"
    server_filter: []
    extra_query: {}
    max_items: 500
  lolz:
    enabled: true
    category: steam
    # Имена параметров проверьте в UI -> «Lolz» -> «Параметры» (категория steam).
    params:
      game: [730]                  # 730 — AppID CS2
      order_by: price_to_up
      # csgo_prime: 1              # только с Prime (пример; проверьте имя параметра)
      # pmin: 1000
      # pmax: 50000
    pages: 3
    max_items: 500

criteria:
  price:
    min: 1000
    max: 50000
  must_any:
    - "Prime => prime|прайм"
    - "FACEIT => faceit|фейсит|фэйсит"
    - "Global Elite => global|глобал*|global elite|supreme|суприм*|legendary eagle|орел|орёл"
    - "Inventory => inventory|инвентар*|скин*|skin*"
    - "Knife => нож*|knife|knives|керамбит|karambit|butterfly|бабочка"
    - "Gloves => перчатк*|gloves"
    - "Medals => медал*|medal*|coin|коин"
    - "Premier => premier|премьер|рейтинг*|rating|elo|эло"
  must_all: []
  exclude:
    - "vac|вак|vac ban|vac-ban|вакбан"
    - "бан|ban|banned|забанен*|заблокирован*"
    - "trade ban|трейд бан|трейдбан|trade-ban|блок* трейд*|запрет обмена"
    - "red trust|красный траст|red trust factor"
    - "без прайма|без prime|no prime|non prime|non-prime"
    - "без почты|без доступа к почте|no email"
    - "буст*|boost*|калибровк*"
    - "аренда|в аренду|rent*"
  regex_any: []
  regex_exclude:
    - "(есть|стоит|имеется|получен|словил)\\s+(vac|бан|ban)"
  numeric: []
  # numeric:
  #   - {field: steam_level, min: 10}
  #   - {field: csgo_inv_value, min: 5000}
  highlights:
    - "Prime => prime|прайм"
    - "FACEIT => faceit|фейсит|фэйсит"
    - "Global Elite => global elite|глобал*|global|ge"
    - "Supreme => supreme|суприм*"
    - "Premier => premier|премьер"
    - "Knife => нож*|knife|knives"
    - "Karambit => керамбит|karambit"
    - "Butterfly => butterfly|бабочка"
    - "Gloves => перчатк*|gloves"
    - "AWP => awp|авп"
    - "AK-47 => ak-47|ak47|ак-47|ак47|калаш*"
    - "Dragon Lore => dragon lore|драгон лор|dlore"
    - "Medals => медал*|medal*"
    - "5 Year Coin => 5 year coin|5 лет|five year"
    - "10 Year Coin => 10 year coin|10 лет|ten year"
    - "Service Medal => service medal|сервис медал*"
    - "Inventory => inventory|инвентар*"
    - "Первый владелец => первый владелец|first owner|первовлад*"
    - "Родная почта => родная почта|native mail|native email|полный доступ|full access"
  regions: []
  min_score: 1.0
  seller_min_reviews: null

pricing:
  mode: formula
  formula: "price * 2 - 1000"
  percent: 90.0
  multiplier: 1.9
  tiers: []
  min_margin: 2000
  round_to: 100
  round_mode: nearest
  price_ending: null

lot_template:
  funpay_subcategory_id: null
  title_ru: ""
  title_en: ""
  description_ru: ""
  description_en: ""
  amount: 1
  deactivate_after_sale: true
  active: true
  fields: {}
