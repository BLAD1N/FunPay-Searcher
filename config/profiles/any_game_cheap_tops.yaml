# ============================================================================
#  ШАБЛОН ПРОФИЛЯ: «дешёвые топы» для любой игры — ВСЕ опции с комментариями.
#
#  Скопируйте файл под новым именем (имя файла = id), поменяйте game / источники /
#  слова и включите (enabled: true). Профиль намеренно выключен: это справочник.
#  Идея профиля: ловить ДЕШЁВЫЕ (до 5 000 ₽) аккаунты с «топовым» содержимым, которые
#  продавцы выставляют ниже рынка, и перепродавать с большой процентной наценкой.
# ============================================================================

# --- Паспорт профиля ---------------------------------------------------------
id: any_game_cheap_tops          # уникальный id = имя файла; латиница, цифры, «_», «-»
name: "ШАБЛОН — дешёвые топы (любая игра)"   # как профиль называется в UI и в {profile_name}
game: any                        # id игры: wot, wot_blitz, dota2, cs2, fortnite, genshin, valorant,
                                 # lol, pubg, apex, brawl_stars, clash_royale, standoff2, roblox, eft,
                                 # warface, steam. Для известных id {game} даст полное название
                                 # («World of Tanks»), для остальных — id с большой буквы («Any»).
region: null                     # RU / EU / NA / ASIA / null. Подставляется в {region}, если площадка
                                 # не определила регион объявления. Не фильтрует — для этого criteria.regions.
enabled: false                   # true — профиль участвует в поиске/мониторинге
description: >-                  # произвольное описание для себя (в лот не попадает)
  Справочный профиль: все поля с пояснениями. Ловит дешёвые аккаунты с «топовым»
  содержимым в любой игре.

# --- Источники объявлений ----------------------------------------------------
sources:
  funpay:                        # поиск по каталогу FunPay
    enabled: true
    subcategory_id: null         # точный узел https://funpay.com/lots/{id}/ (UI -> «Категории FunPay»)
    subcategory_ids: []          # или сразу несколько узлов: [148, 149]; приоритет: ids -> id -> game_query
    game_query: "World of Tanks" # если id не задан: игра по названию (точное -> по началу -> подстрока)
    subcategory_query: "Аккаунты"   # и подкатегория по названию («Аккаунты», «Золото», ...)
    server_filter: []            # оставить только объявления, где сервер/регион содержит подстроку: ["RU", "Lesta"]
    extra_query: {}              # дополнительные GET-параметры фильтров страницы: {"f-server": "1"}
    max_items: 500               # максимум объявлений за один проход
  lolz:                          # поиск по Lolzteam Market (нужен токен в настройках)
    enabled: true
    category: world-of-tanks     # категория из URL https://lzt.market/{category}/ — steam, fortnite, mihoyo,
                                 # riot, world-of-tanks, wot-blitz, epicgames, supercell, ea, roblox, warface,
                                 # escape-from-tarkov, battlenet, socialclub, uplay, minecraft ...
    params:                      # параметры API категории. ДОКУМЕНТИРОВАННЫЕ (работают везде):
      order_by: price_to_up      #   order_by: price_to_up | price_to_down | pdate_to_down | pdate_to_up
      # title: "все топы"        #   title: слово в заголовке объявления
      # pmin: 500                #   pmin/pmax: цена от/до — подставляются из criteria.price автоматически
      # pmax: 5000
      # game: [570, 730]         #   game[] (только steam): AppID игр — 570 Dota 2, 730 CS2, 578080 PUBG
      # origin: [personal, resale]   # origin[]: происхождение аккаунта (brute, stealer, autoreg, personal...)
      # not_origin: [brute, stealer] # not_origin[]: исключить происхождение
      # nsb: 1                   #   nsb=1 — не продавался ранее; sb=1 — продавался
      # Остальные (tanks_min, level_min, skins_min, trophies_min, edition...) зависят
      # от категории — ПРОВЕРЬТЕ ЧЕРЕЗ UI -> «Lolz» -> «Параметры».
    pages: 3                     # сколько страниц выдачи просматривать (по ~40 объявлений)
    max_items: 500

# --- Критерии отбора -----------------------------------------------------------
# Синтаксис слов (одинаков для must_any / must_all / exclude / highlights):
#   слово            — целиком, без учёта регистра; «ё»=«е»; латинские a c e o p x y = кириллица
#   a|b|c            — любой из вариантов
#   топ*             — любое окончание (топы, топовый, топов); можно внутри фразы: "топ* танк*"
#   все топы         — фраза; знаки препинания не важны («Об. 279» == «об 279»)
#   Подпись => a|b   — в заголовок лота попадёт «Подпись», что бы ни совпало
# Балл: +1 за слово must_any (максимум 5), +1 за слово must_all, +1 за regex_any,
# +1 за числовое правило, +0.5 за «фишку». Проходит: нет отказов и балл >= min_score.
criteria:
  price:                         # цена ИСХОДНИКА в рублях (вне диапазона — отказ)
    min: 300                     # отсекаем «мусор» и объявления-ошибки
    max: 5000                    # «дешёвые топы»: только до 5 000 ₽
  must_any:                      # хотя бы одно обязано встретиться (иначе отказ). Только маркеры качества!
    - "Все топы => все топы|все топ*|всех топов|топов*|all tops|all tier 10|tier x"
    - "Все десятки => все 10|все десятки|десятки|десяток|все х|все x"
    - "Коллекционер => коллекционер*|collector*|все ветки|все танки|all tanks|полн* коллекц*"
    - "Наградная техника => наградн* танк*|наградн* техник*|reward tank*|chieftain|чифтейн|об 279|об 260|об 907"
  must_all: []                   # ВСЕ слова обязаны встретиться (+1 за каждое). Пример: ["полный доступ"]
  exclude:                       # стоп-слова: любое совпадение — отказ. Только то, что ТОЧНО дисквалифицирует.
    # Наличие бана. Голое «бан|ban» НЕ пишем — отсечёт «без бана», «no ban», «банов нет».
    - "забанен*|заблокирован*|banned|в бане|есть бан|стоит бан|словил бан|получил бан|с баном|пермабан|перма бан|permanent* ban*|perma ban"
    # Нет доступа к почте. «без привязки» голым НЕ пишем — «без привязки к телефону» это плюс.
    - "без почты|без доступа к почте|почта не выдается|почта не дается|без привязки почты|без привязки к почте|почта не привязана|no email|without email|no mail access"
    # Временный доступ / аренда / прокат. «временно» голым НЕ пишем — «временно снижена цена».
    - "аренда|в аренду|арендовать|прокат|rent|rental|for rent|временн* доступ*|временн* аккаунт*|временное пользование|temporary access"
    # Только обмен. Голое «обмен» НЕ пишем — «обмен доступен» = разрешён трейд (плюс для Steam).
    - "только обмен|на обмен|обменяю|меняю на|обмен на|trade only|for trade|swap only"
    # Услуги вместо аккаунта. «прокачка» голым НЕ пишем — «прокачка ангара 90%» описывает аккаунт.
    - "буст|бустинг|boost|boosting|boosted|прокачаю|прокачка на заказ|прокачка аккаунтов|услуг* прокачк*|накрутк*|калибровк*"
    # Читы. «чит*» НЕ пишем — совпадёт с «читайте описание».
    - "cheat*|чит|читы|читами|читом|hack*|хак|хакнут*"
  regex_any: []                  # регулярные выражения (хотя бы одно, если список не пуст); к тексту в нижнем регистре
  # regex_any:
  #   - '(?<!\d)([6-9]\d{3}|1\d{4})\s*(mmr|ммр)'        # MMR от 6000
  #   - '(?<!\d)(\d{2,3})\s*(k|к|тыс)\s*(кубк|trophies)' # кубки «35к кубков»
  regex_exclude:                 # исключающие регулярные выражения (любое совпадение — отказ)
    - '(есть|стоит|имеется|получен|словил|словлен|with|has)\s+(бан|ban)'
    # Наличие VAC/трейд-бана с учётом отрицаний «без/нет/no» и «vac ban: нет»:
    # - '(?<!no )(?<!без )(?<!нет )(vac|trade)[\s-]*(ban|бан)(?!\w*\s*[:\-–—]?\s*(нет|no|none|0\b))'
  numeric: []                    # числовые правила по полям attributes (Lolz отдаёт поля структурно).
  # numeric:                     # Отсутствующее поле НЕ отклоняет (только пометка); вне диапазона — отказ.
  #   - {field: tanks_count, min: 30}          # имя поля — см. attributes["raw_keys"] находки
  #   - {field: seller.sold_items_count, min: 5}   # вложенные поля через точку
  highlights:                    # «фишки»: +0.5 балла, попадают в {highlights} / {highlights_lines}
    - "Chieftain => chieftain|чифтейн|чифт*"
    - "Об. 279 (р) => об 279|объект 279|об279|279 р|279р"
    - "Об. 260 => об 260|объект 260|об260"
    - "Об. 907 => об 907|объект 907|об907"
    - "Коллекционер => коллекционер*|collector*|все ветки|все танки|all tanks"
    - "Голда => голд*|gold|золот*"
    - "Полный доступ => полный доступ|full access|родная почта|native mail|first owner|первый владелец"
  regions: []                    # допустимые регионы: ["RU"], ["EU", "NA"]... Понимает синонимы (Lesta,
                                 # Россия, Европа, США, Азия). Пусто — любой. Не определён — не отклоняется.
  min_score: 1.5                 # минимальный балл: 1.5 = слово из must_any + хотя бы одна фишка
  seller_min_reviews: null       # минимум отзывов продавца (поле seller_reviews заполняют источники); null — не проверять

# --- Наценка -------------------------------------------------------------------
pricing:
  mode: tiers                    # percent | multiplier | formula | tiers
  percent: 100.0                 # для percent: цена * (1 + percent/100); для tiers — ступень по умолчанию
  multiplier: 2.5                # для multiplier: цена * multiplier
  formula: "price * 2.5 if price < 2000 else price * 2"   # для formula: price, арифметика, min/max/round/floor/ceil, условия
  tiers:                         # для tiers: ступени по цене закупки (up_to включительно, в порядке возрастания)
    - {up_to: 1000, percent: 200}    # до 1 000 ₽ — +200 %
    - {up_to: 3000, percent: 150}    # до 3 000 ₽ — +150 %
    - {up_to: 5000, percent: 100}    # до 5 000 ₽ — +100 %
  min_margin: 500                # минимальная абсолютная наценка (₽)
  round_to: 100                  # округление итоговой цены (0 — без округления)
  round_mode: up                 # nearest | down | up
  price_ending: 990              # после округления: цена вида 2 990 / 4 990 (null — отключить)

# --- Шаблон лота ---------------------------------------------------------------
# Плейсхолдеры: {game} {game_short} {region} {highlights} ({highlights} через « • »)
#   {highlights_lines} (по строке с «✅ ») {price} (29 000) {price_raw} (29000) {source_price}
#   {profile_name} {currency} {attr[имя]} (любое поле attributes, нет поля — пусто).
#   {seller} {source} {source_title} {source_description} существуют, но в лот их НЕ ставим —
#   покупатель не должен видеть, откуда аккаунт.
# Заголовок режется до 100 символов: сначала убираются «фишки» с конца, потом по слову.
# Пустой title_ru -> "{game} | {highlights} | {region}", пустой description_ru -> встроенный шаблон.
lot_template:
  funpay_subcategory_id: null    # узел /lots/{id}/ куда публиковать; null — тот же, где нашли
  title_ru: "🔥 Топовый аккаунт | {highlights} | {region} | Полный доступ"
  title_en: "🔥 Top account | {highlights} | {region} | Full access"
  description_ru: |
    🔥 {profile_name}: {highlights}
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    📦 Что внутри:
    {highlights_lines}

    🛡 Гарантии магазина:
    ✔ Аккаунт проверяется перед передачей покупателю
    ✔ Полный доступ — меняете пароль и привязываете свою почту
    ✔ Помогаем с первым входом и сменой данных
    ✔ Сделка через FunPay — деньги под защитой площадки

    🚚 Доставка:
    • Регион: {region}
    • Выдача данных в чате после оплаты, обычно 10–60 минут
    • Цена: {price} {currency} — фиксированная, без скрытых доплат

    💬 Напишите перед покупкой — подтвердим наличие и ответим на вопросы!
  description_en: ""             # пусто — берётся description_ru (аналогично title_en)
  amount: 1                      # количество товара в лоте (аккаунт — всегда 1)
  deactivate_after_sale: true    # снять лот после продажи
  active: true                   # публиковать сразу активным
  fields:                        # доп. поля формы лота FunPay (имена — UI -> «Форма лота»), с плейсхолдерами
    {}
  # fields:
  #   "fields[server]": "{region}"
  #   "fields[summary][ru]": "{highlights}"

# --- Примеры для тестов --------------------------------------------------------
# Строка = заголовок (цена — середина диапазона, регион — регион профиля);
# словарь = {text, price, region, attrs}. positive обязаны пройти, negative — нет.
examples:
  positive:
    - "Продам акк, все топы, Chieftain, Об. 279 (р), родная почта"
    - {text: "Коллекционер: все ветки, Об. 907, 10к голды", price: 1500}
  negative:
    - "Продам акк, все топы, Chieftain — есть бан"
    - {text: "Все топы, Chieftain, Об. 279 (р)", price: 9000}     # дороже 5 000
    - "Акк 5 танков 8 уровня"                                      # нет ключевых слов
    - "Все топы, Chieftain — сдам в аренду"
    - "Все топы, Chieftain, без доступа к почте"
    - "Все топы в вашем ангаре за неделю — прокачка на заказ, буст"
