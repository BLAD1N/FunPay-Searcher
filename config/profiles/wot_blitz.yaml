# ============================================================================
#  Профиль поиска: World of Tanks Blitz / Tanks Blitz — аккаунты с топами
#  Подробные комментарии к каждому полю — в wot_ru_tops.yaml, полный шаблон
#  со всеми опциями — any_game_cheap_tops.yaml.
# ============================================================================
id: wot_blitz
name: "WoT Blitz — аккаунты с топами"
game: wot_blitz
region: null                     # Blitz кроссплатформенный — регион не ограничиваем
enabled: false
description: >-
  Аккаунты WoT Blitz (Wargaming) и Tanks Blitz (Lesta) с техникой X уровня,
  наградной/коллекционной техникой и легендарными камуфляжами.

sources:
  funpay:
    enabled: true
    subcategory_id: null
    subcategory_ids: []
    game_query: "World of Tanks Blitz"   # на FunPay может называться «Tanks Blitz» — проверьте в UI -> «Категории»
    subcategory_query: "Аккаунты"
    server_filter: []                    # пусто — любые серверы (RU/EU/NA/ASIA)
    extra_query: {}
    max_items: 500
  lolz:
    enabled: true
    category: wot-blitz
    params:
      order_by: price_to_up              # документированный параметр
      # tanks_min: 20                    # минимум танков — проверьте через Параметры
      # gold_min: 1000                   # минимум голды — проверьте через Параметры
    pages: 3
    max_items: 500

criteria:
  price:
    min: 1000
    max: 30000
  # В Blitz почти в каждом объявлении есть «голда» и «прем» — это НЕ критерии, только фишки.
  must_any:
    - "Все топы => все топы|все топ*|всех топов|всеми топами|топ* танк*|топов*|топы|all tops|all tier 10|tier 10|tier x|t10|20 топов|30 топов|40 топов|50 топов"
    - "Все десятки => все 10|все десятки|всех десяток|десятки|десяток|все х|все x|10 десяток|20 десяток|30 десяток"
    - "10 lvl => 10 lvl|10 лвл|10 уровн*|10 ур|х лвл|x lvl|х уровн*|x уровн*|level 10|lvl 10"
    - "Много техники => 50 танк*|60 танк*|70 танк*|80 танк*|100 танк*|150 танк*|200 танк*|50 tanks|100 tanks|150 tanks|200 tanks|все танки|all tanks|коллекционер*|collector*"
    - "Премы => прем* танк*|премы|премов|премтанк*|premium tank*|premiums"
    - "Легендарный камуфляж => легендар* камуфляж*|легендарн* камо|legendary camo*|легендарк*|легендарн* камуфл*"
    - "Коллаборации => коллаб*|collab*|valkyrie|валькири*|warhammer|вархаммер|gundam|гандам|godzilla|годзилла|kong|конг"
    - "Chieftain => chieftain|чифтейн|чифт*"
    - "Наградная техника => наградн* танк*|наградн* техник*|reward tank*|коллекционн* танк*|collectible tank*|редк* танк*|rare tank*"
  must_all: []
  exclude:
    - "забанен*|заблокирован*|banned|в бане|есть бан|стоит бан|словил бан|получил бан|с баном|пермабан|перма бан|permanent* ban*|perma ban"
    - "без почты|без доступа к почте|почта не выдается|почта не дается|без привязки почты|без привязки к почте|почта не привязана|no email|without email|no mail access"
    - "аренда|в аренду|арендовать|прокат|rent|rental|for rent|временн* доступ*|временн* аккаунт*|временное пользование|temporary access"
    - "только обмен|на обмен|обменяю|меняю на|обмен на|trade only|for trade|swap only"
    - "буст|бустинг|boost|boosting|boosted|прокачаю|прокачка на заказ|прокачка аккаунтов|прокачка вашего|услуг* прокачк*|накрутк*"
    - "world of tanks pc|wot pc|пк версия|мир танков пк|консольн*|console|modern armor|мир кораблей|wows"   # не Blitz
    - "без game center|без гейм центр*|без wargaming id|без wg id|без lesta id|без леста id|без lesta аккаунт*"     # без привязки к аккаунту издателя — не передать
  regex_any: []
  regex_exclude:
    - '(есть|стоит|имеется|получен|словил|словлен|with|has)\s+(бан|ban)'
  numeric: []
  # numeric:
  #   - {field: tanks_count, min: 20}     # проверьте имя поля через attributes["raw_keys"]
  highlights:
    - "Chieftain => chieftain|чифтейн|чифт*"
    - "Об. 140 => об 140|объект 140|об140|obj 140"
    - "Об. 268 => об 268|объект 268|об268|obj 268"
    - "Об. 907 => об 907|объект 907|об907"
    - "E 100 => е 100|е100|e-100"
    - "ИС-7 => ис-7|ис7|ис 7|is-7|is7"
    - "ИС-5 => ис-5|ис5|is-5"
    - "Т-62А => т-62а|т-62 а|т62а|t-62a"
    - "60TP => 60tp|60тр|60 тп|60тп"
    - "FV4005 => fv4005|fv 4005|бабаха"
    - "Kranvagn => kranvagn|крана|кранваген|кранвагн"
    - "Progetto => progetto|прогетто"
    - "Maus => maus|маус"
    - "Leopard 1 => leopard 1|leopard|леопард"
    - "Smasher => smasher|смэшер|смешер"
    - "Annihilator => annihilator|аннигилятор"
    - "Gravedigger => gravedigger|грейвдиггер|гробокопат*"
    - "Helsing => helsing|хельсинг"
    - "Dracula => dracula|дракула"
    - "Glacial => glacial|глэйшал|глейшал"
    - "Shinobi => shinobi|шиноби"
    - "Vindicator => vindicator|виндикатор"
    - "Tankenstein => tankenstein|танкенштейн"
    - "Blaze WZ => blaze wz|blaze|блейз"
    - "Valkyrie => valkyrie|валькири*"
    - "Warhammer => warhammer|вархаммер|предатор|predator|rhino|рино"
    - "Gundam => gundam|гандам"
    - "Легендарный камуфляж => легендар* камуфляж*|легендарн* камо|legendary camo*|легендарк*|легендарн* камуфл*"
    - "Коллекционер => коллекционер*|collector*|все танки|all tanks"
    - "Голда => голд*|gold|золот*"
    - "Прем аккаунт => прем аккаунт|прем акк|premium account|премиум аккаунт"
  regions: []
  min_score: 1.0
  seller_min_reviews: null

pricing:
  mode: formula
  formula: "price * 2 - 500"    # 5 000 -> 9 500; 1 500 -> 2 500 (min_margin подтянет)
  percent: 90.0
  multiplier: 1.9
  tiers: []
  min_margin: 1000
  round_to: 100
  round_mode: nearest
  price_ending: null

lot_template:
  funpay_subcategory_id: null
  title_ru: "⚡ {game} | {highlights} | Полный доступ, смена почты"
  title_en: "⚡ {game} account | {highlights} | Full access"
  description_ru: |
    ⚡ {game} — прокачанный аккаунт с топами
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    📦 Что внутри:
    {highlights_lines}

    🛡 Гарантии магазина:
    ✔ Аккаунт проверяется перед передачей покупателю
    ✔ Полный доступ — меняете пароль и привязываете свою почту
    ✔ Помогаем с первым входом и сменой данных
    ✔ Сделка через FunPay — деньги под защитой площадки

    🚚 Доставка:
    • Регион: {region}
    • Выдача данных в чате после оплаты, обычно 10–60 минут
    • Состав ангара, статистика и привязки — по запросу в чате

    💬 Напишите перед покупкой — подтвердим наличие и ответим на вопросы!
  description_en: ""
  amount: 1
  deactivate_after_sale: true
  active: true
  fields: {}

examples:
  positive:
    - "WoT Blitz: все топы, Е 100, легендарный камуфляж, 5к голды"
    - "Tanks Blitz Lesta, 25 десяток, Chieftain, Smasher, Gravedigger, родная почта"
    - "Аккаунт Блиц 120 танков, Valkyrie, Annihilator, прем аккаунт на год"
  negative:
    - "WoT Blitz 3 танка 7 уровня, 200 голды"
    - "WoT Blitz все топы, Chieftain — аккаунт забанен"
    - "Прокачка аккаунтов WoT Blitz на заказ, буст побед"
    - "World of Tanks PC все топы, Об. 279"
    - "WoT Blitz все топы, без Game Center"
    - {text: "WoT Blitz все топы, Е 100", price: 50000}
