# ============================================================================
#  Профиль поиска: World of Tanks / Мир танков (Lesta, RU) — топовые аккаунты
#
#  id профиля = имя файла (wot_ru_tops). Профили можно править здесь или в UI.
#  Это «эталонный» профиль с подробными комментариями — остальные устроены так же.
#  Полностью документированный шаблон со ВСЕМИ опциями: any_game_cheap_tops.yaml.
# ============================================================================
id: wot_ru_tops
name: "WoT (Lesta RU) — топовые аккаунты"
game: wot            # идентификатор игры: wot, wot_blitz, dota2, cs2, fortnite, genshin, valorant...
region: RU           # регион профиля; подставляется в {region}, если площадка не определила регион
enabled: true        # участвует ли профиль в поиске
description: >-
  Аккаунты Мира танков (Lesta Games, RU-регион) с топовой техникой X уровня,
  наградной техникой (Chieftain, Об. 279 (р), Об. 260, Об. 907, Carro 45t...)
  и коллекционными ангарами.

# ---------------------------------------------------------------- источники --
sources:
  funpay:
    enabled: true
    # Узел FunPay, где ищем (https://funpay.com/lots/{id}/). Если не знаете id —
    # оставьте null: приложение найдёт игру по названию (game_query) и подкатегорию
    # по названию (subcategory_query). Список id: UI -> «Категории FunPay».
    subcategory_id: null
    subcategory_ids: []              # либо сразу несколько узлов
    game_query: "World of Tanks"     # название игры на FunPay (точное -> по началу -> подстрока)
    subcategory_query: "Аккаунты"    # подкатегория: Аккаунты / Золото / Прокачка...
    # Фильтр по серверу/региону объявления (подстроки названия сервера на FunPay).
    server_filter: ["RU", "Lesta", "Россия", "Мир танков"]
    extra_query: {}                  # дополнительные GET-параметры фильтров страницы
    max_items: 500                   # максимум объявлений за один поиск

  lolz:
    enabled: true
    # Категория Lolzteam Market (из URL https://lzt.market/{category}/):
    # world-of-tanks, wot-blitz, steam, fortnite, mihoyo, riot, supercell, ...
    category: world-of-tanks
    # Параметры запроса к API. Документированные общие параметры: pmin/pmax (подставляются
    # из criteria.price автоматически), title, order_by. Остальные — специфичны для категории,
    # их имена ПРОВЕРЬТЕ ЧЕРЕЗ UI -> «Lolz» -> «Параметры» (кнопка «Параметры категории»).
    params:
      order_by: price_to_up          # сортировка: price_to_up / price_to_down / pdate_to_down
      # wot_region: ru               # регион сервера (проверьте через Параметры)
      # tanks_min: 30                # минимум танков в ангаре (проверьте через Параметры)
      # premium_tanks_min: 5         # минимум премов (проверьте через Параметры)
    pages: 3                         # сколько страниц выдачи просматривать
    max_items: 500

# ----------------------------------------------------------------- критерии --
# Правила для слов (must_any / must_all / exclude / highlights):
#   • регистр не важен, «ё» = «е», латинские двойники букв (a, c, e, o, p, x, y)
#     считаются кириллицей: «E 100» = «Е 100», «x lvl» = «х лвл»;
#   • слово ищется целиком: «10» не найдётся внутри «100», «бан» — внутри «бана»;
#   • варианты через «|»: "чифтейн|chieftain";
#   • «*» — любое окончание слова: "топ*" найдёт «топы», «топовый», «топов»;
#   • фраза с пробелами ищется как фраза: "все топы" (знаки препинания не важны);
#   • подпись для «фишки» через «=>»: "Chieftain => chieftain|чифт*" — в заголовок
#     лота попадёт «Chieftain», какой бы вариант ни встретился в тексте.
# Балл: +1 за каждое слово из must_any (максимум 5), +1 за каждое из must_all,
# +1 за regex_any, +0.5 за каждую «фишку». Объявление проходит, если нет отказов
# и балл >= min_score.
#
# ЧЕГО НЕ ДЕЛАЕМ (ложные срабатывания): не пишем в must_any «аккаунт», «акк», «прем»,
# «танки», «голда» — это есть в КАЖДОМ объявлении и не говорит о качестве. В exclude не пишем
# голое «бан|ban» («без бана», «no ban» — это хорошие объявления) и «обмен» («обмен доступен»).
criteria:
  price:
    min: 3000          # цена исходника от (руб.) — дешевле обычно «пустые» ангары
    max: 60000         # и до — дороже продаётся долго

  # Хотя бы одно из этих слов обязано встретиться (иначе — отказ). Только маркеры КАЧЕСТВА.
  must_any:
    - "Все топы => все топы|все топ*|всех топов|всеми топами|топ* танк*|топов*|топы|50 топов|60 топов|70 топов|80 топов|100 топов"
    - "Все десятки => все 10|все десятки|всех десяток|десятки|десяток|все х|все x|20 десяток|30 десяток|40 десяток|50 десяток"
    - "10 lvl => 10 lvl|10 лвл|10 уровн*|10 ур|10-го уровня|х лвл|x lvl|х уровн*|x уровн*|10 левел*"
    - "Коллекционер => коллекционер*|коллекционн* ангар*|все ветки|все танки|полн* коллекц*|все прокачиваем*"
    - "Chieftain => чифтейн|chieftain|чифт*|t95 fv4201|т95 fv4201|fv4201"
    - "Об. 279 (р) => об 279|объект 279|об279|279 р|279р"
    - "Об. 260 => об 260|объект 260|об260"
    - "Об. 907 => об 907|объект 907|об907"
    - "Carro 45t => carro 45t|carro|карро"
    - "Kampfpanzer 07 RH => kampfpanzer|кампфпанцер|kpz 07|kpz07|07 rh"
    - "121B => 121b|121б"
    - "M60 => m60|м60|м 60"
    - "VK 72.01 K => vk 72.01|vk 72|vk72|вк 72|7201 k|7201 к"
    - "Премы => прем* танк*|премы|премов|премтанк*|прем техник*|премиум* танк*"
    - "Наградная техника => наградн* танк*|наградн* техник*|клановая техника|клановые танки|наградк*"

  # Все эти слова обязаны встретиться. Для WoT не нужно — оставляем пустым.
  must_all: []

  # Стоп-слова: любое совпадение — отказ. Только формулировки, которые ТОЧНО дисквалифицируют.
  exclude:
    # наличие бана (голое «бан|ban» отсекало бы «без бана», «no ban», «банов нет»)
    - "забанен*|заблокирован*|banned|в бане|есть бан|стоит бан|словил бан|получил бан|с баном|пермабан|перма бан|permanent* ban*|perma ban"
    # нет доступа к почте («без привязки» само по себе не пишем: «без привязки к телефону» — это плюс)
    - "без почты|без доступа к почте|почта не выдается|почта не дается|без привязки почты|без привязки к почте|почта не привязана|no email|without email|no mail access"
    # временный доступ / аренда / прокат
    - "аренда|в аренду|арендовать|прокат|rent|rental|for rent|временн* доступ*|временн* аккаунт*|временное пользование|temporary access"
    # только обмен (голое «обмен» не пишем — «обмен доступен» значит трейд разрешён)
    - "только обмен|на обмен|обменяю|меняю на|обмен на|trade only|for trade|swap only"
    # услуги вместо аккаунта: буст, прокачка на заказ, калибровка («прокачка» само по себе —
    # это ещё и «прокачка ангара», поэтому только явные формулировки услуги)
    - "буст|бустинг|boost|boosting|boosted|прокачаю|прокачка на заказ|прокачка аккаунтов|прокачка вашего|услуг* прокачк*|накрутк*"
    # другие игры серии
    - "blitz|блиц|tanks blitz|мир кораблей|world of warships|wows|warplanes|консольн*|console|modern armor"
    # чужие сервера (это RU-профиль)
    - "wg eu|eu wargaming|сервер eu|eu сервер|na сервер|сервер na|asia сервер|сервер asia"

  # Регулярные выражения (хотя бы одно должно совпасть, если список не пуст).
  # Для WoT не используем — достаточно слов.
  regex_any: []
  # Исключающие регулярные выражения (к тексту без учёта регистра).
  regex_exclude:
    - '(есть|стоит|имеется|получен|словил|словлен|with|has)\s+(бан|ban)'

  # Числовые правила по полям attributes (имена полей зависят от площадки —
  # посмотрите attributes["raw_keys"] у найденного объявления в UI). Отсутствующее поле
  # не отклоняет объявление, только помечает «поле X отсутствует».
  numeric: []
  # numeric:
  #   - {field: wot_tanks_count, min: 30}          # проверьте имя поля через attributes
  #   - {field: wot_premium_tanks_count, min: 5}

  # «Фишки» — техника, которую выносим в заголовок лота (+0.5 балла за каждую).
  highlights:
    - "Chieftain => chieftain|чифтейн|чифт*|т95 fv4201|t95 fv4201|fv4201"
    - "Об. 279 (р) => об 279|объект 279|об279|279 р|279р"
    - "Об. 260 => об 260|объект 260|об260"
    - "Об. 907 => об 907|объект 907|об907"
    - "Carro 45t => carro 45t|carro|карро"
    - "Kampfpanzer 07 RH => kampfpanzer|кампфпанцер|kpz 07|kpz07|07 rh"
    - "121B => 121b|121б"
    - "M60 => m60|м60|м 60"
    - "VK 72.01 K => vk 72.01|vk 72|vk72|вк 72|7201 k|7201 к"
    - "Об. 140 => об 140|объект 140|об140"
    - "Об. 268/4 => об 268 4|объект 268 4|об 268/4|268 4"
    - "E 100 => е 100|е100|e-100"
    - "E 50 M => е 50 м|е50м|e 50m|e50 m"
    - "ИС-7 => ис-7|ис7|ис 7|is-7|is7"
    - "ИС-4 => ис-4|ис4|is-4"
    - "60TP => 60tp|60тр|60 тп|60тп"
    - "Strv 103B => strv|стрв|strv 103|103b"
    - "Kranvagn => kranvagn|крана|кранваген|кранвагн"
    - "Super Conqueror => super conqueror|супер конь|суперконь|супер конкерор|s conq"
    - "WT E 100 => wt e 100|wt e100|вафля|waffentrager|ваффентрагер"
    - "Type 5 => type 5|тайп 5|тип 5 хеви"
    - "Maus => maus|маус"
    - "Leopard 1 => leopard 1|leopard|леопард"
    - "FV4005 => fv4005|fv 4005|бабаха|fv4005 stage ii"
    - "Bourrasque => bourrasque|бурраск|бураск*"
    - "BZ-176 => bz-176|bz176|бз-176|бз 176"
    - "Skorpion G => skorpion|скорпион"
    - "Progetto => progetto|прогетто"
    - "Löwe => lowe|löwe|лёва|лева"
    - "AMX 50 B => amx 50 b|amx 50b|амх 50"
    - "Коллекционер => коллекционер*|коллекционн* ангар*|все ветки|все танки|полн* коллекц*"
    - "Голда => голд*|gold|золот*"      # золото на счету — фишка, но не критерий отбора

  # Допустимые регионы (RU / EU / NA / ASIA, понимает синонимы: Lesta, Россия, Европа...).
  # Если площадка не определила регион — объявление не отклоняется.
  regions: ["RU"]

  # Минимальный балл для попадания в кандидаты.
  min_score: 1.0

  # Минимум отзывов у продавца (null — не проверять). Поле seller_reviews заполняют источники.
  seller_min_reviews: null

# ------------------------------------------------------------------- наценка --
pricing:
  # mode: percent (цена * (1+percent/100)) | multiplier (цена * multiplier)
  #       | formula (арифметика над price) | tiers (ступени по цене)
  mode: formula
  formula: "price * 2 - 1000"   # 15 000 -> 29 000; 5 000 -> 9 000
  percent: 90.0                 # используется при mode: percent / tiers
  multiplier: 1.9               # используется при mode: multiplier
  tiers: []                     # пример: [{up_to: 10000, percent: 100}, {up_to: 50000, percent: 80}]
  min_margin: 2000              # минимальная наценка в рублях (ниже не опускаемся)
  round_to: 100                 # округление итоговой цены
  round_mode: nearest           # nearest | down | up
  price_ending: null            # напр. 990 -> цена вида 28 990 (после округления)

# --------------------------------------------------------------- шаблон лота --
# Плейсхолдеры: {game} {game_short} {region} {highlights} {highlights_lines}
#   {price} {price_raw} {source_price} {source_title} {source_description}
#   {seller} {source} {profile_name} {currency} {attr[имя_атрибута]}
# Неизвестный плейсхолдер остаётся как есть. Заголовок обрезается до 100 символов
# (сначала убираются «фишки» с конца). {seller}/{source}/{source_title} в шаблонах
# НЕ используем — покупатель не должен видеть, откуда аккаунт.
lot_template:
  funpay_subcategory_id: null   # узел /lots/{id}/ для публикации (null — тот же, где искали)
  title_ru: "🔥 {game_short} {region} | {highlights} | Полный доступ, смена почты"
  title_en: "🔥 {game_short} {region} account | {highlights} | Full access"
  description_ru: |
    🔥 {game} ({region}) — топовый ангар
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    📦 Что внутри:
    {highlights_lines}

    🛡 Гарантии магазина:
    ✔ Аккаунт проверяется перед передачей покупателю
    ✔ Полный доступ — меняете пароль и привязываете свою почту
    ✔ Помогаем с первым входом и сменой данных
    ✔ Сделка через FunPay — деньги под защитой площадки

    🚚 Доставка:
    • Регион: {region}
    • Выдача данных в чате после оплаты, обычно 10–60 минут
    • Состав ангара, статистика и привязки — по запросу в чате

    💬 Напишите перед покупкой — подтвердим наличие и ответим на вопросы!
  description_en: ""            # пусто — берётся description_ru
  amount: 1                     # количество (у аккаунта всегда 1)
  deactivate_after_sale: true   # снять лот после продажи
  active: true                  # публиковать активным
  # Дополнительные поля формы лота FunPay (имена — из UI -> «Форма лота»).
  # В значениях работают те же плейсхолдеры.
  fields: {}
  # fields:
  #   server: "RU"

# ------------------------------------------------------------------- примеры --
# Используются тестами (tests/test_profiles.py): positive обязаны пройти критерии,
# negative — отклониться. Строка = заголовок объявления (цена — середина диапазона,
# регион — регион профиля); словарь = {text, price, region, attrs}.
examples:
  positive:
    - "Аккаунт Мир танков Lesta: все топы, Chieftain, Об. 279 (р), E 100, 20к голды"
    - "Продам акк WoT RU, 45 десяток, Об. 907, Carro 45t, Kampfpanzer 07 RH, без бана"
    - "Коллекционер: все ветки прокачаны, 121B, M60, VK 72.01 K, родная почта"
    - {text: "WoT Lesta, 12 танков X уровня, ИС-7, 60TP, обмен доступен", price: 8000, region: "RU"}
  negative:
    - "Акк WoT все топы, есть бан"
    - {text: "Акк WoT все топы, Chieftain", price: 15000, region: "EU"}
    - {text: "Акк WoT все топы, Chieftain", price: 100000, region: "RU"}
    - "Акк WoT Blitz все топы, Е 100"
    - "Акк WoT 5 танков 8 уровня, прем аккаунт 30 дней"
    - "Прокачка аккаунтов WoT на заказ: все топы за неделю, буст статистики"
    - "Сдам в аренду аккаунт WoT со всеми топами, Chieftain"
    - "Аккаунт WoT все топы, Об. 279 (р), без привязки к почте"
