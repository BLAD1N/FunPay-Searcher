# ============================================================================
#  Профиль поиска: World of Tanks (Lesta, RU) — топовые аккаунты
#
#  id профиля = имя файла (wot_ru_tops). Профили можно править здесь или в UI.
#  Это «эталонный» профиль с подробными комментариями — остальные устроены так же.
# ============================================================================
id: wot_ru_tops
name: "WoT (Lesta RU) — топовые аккаунты"
game: wot            # идентификатор игры: wot, wot_blitz, dota2, cs2, fortnite, genshin, valorant...
region: RU           # регион профиля; подставляется в {region}, если площадка не определила регион
enabled: true        # участвует ли профиль в поиске
description: >-
  Аккаунты Мира танков (Lesta Games, RU-регион) с топовой техникой X уровня,
  наградной техникой (Chieftain, Об. 279 (р), Об. 260) и премами.

# ---------------------------------------------------------------- источники --
sources:
  funpay:
    enabled: true
    # Узел FunPay, где ищем (https://funpay.com/lots/{id}/). Если не знаете id —
    # оставьте null: приложение найдёт игру по названию (game_query) и подкатегорию
    # по названию (subcategory_query). Список id: UI -> «Категории FunPay».
    subcategory_id: null
    subcategory_ids: []              # либо сразу несколько узлов
    game_query: "World of Tanks"     # название игры на FunPay (подстрока, без учёта регистра)
    subcategory_query: "Аккаунты"    # подкатегория: Аккаунты / Золото / Прокачка...
    # Фильтр по серверу/региону объявления (подстроки названия сервера на FunPay).
    server_filter: ["RU", "Lesta", "Россия", "Мир танков"]
    extra_query: {}                  # дополнительные GET-параметры фильтров страницы
    max_items: 500                   # максимум объявлений за один поиск

  lolz:
    enabled: true
    # Категория Lolzteam Market (из URL https://lzt.market/{category}/):
    # world-of-tanks, wot-blitz, steam, fortnite, mihoyo, riot, ...
    category: world-of-tanks
    # Параметры запроса к API — любые фильтры страницы категории. Точные имена
    # параметров смотрите в UI -> «Lolz» -> «Параметры» (они отличаются по категориям).
    params:
      order_by: price_to_up          # сортировка: price_to_up / price_to_down / pdate_to_down
      # pmin: 3000                   # цена от (руб.)
      # pmax: 60000                  # цена до (руб.)
      # email_type: native           # только с родной почтой (пример; проверьте имя параметра)
    pages: 3                         # сколько страниц выдачи просматривать
    max_items: 500

# ----------------------------------------------------------------- критерии --
# Правила для слов (must_any / must_all / exclude / highlights):
#   • регистр не важен, «ё» = «е», латинские двойники букв (a, c, e, o, p, x, y)
#     считаются кириллицей: «E 100» = «Е 100», «x lvl» = «х лвл»;
#   • слово ищется целиком: «10» не найдётся внутри «100»;
#   • варианты через «|»: "чифтейн|chieftain";
#   • «*» — любое окончание слова: "топ*" найдёт «топы», «топовый», «топов»;
#   • фраза с пробелами ищется как фраза: "все топы" (знаки препинания не важны);
#   • подпись для «фишки» через «=>»: "Chieftain => chieftain|чифт*" — в заголовок
#     лота попадёт «Chieftain», какой бы вариант ни встретился в тексте.
# Балл: +1 за каждое слово из must_any (максимум 5), +1 за каждое из must_all,
# +1 за regex_any, +0.5 за каждую «фишку». Объявление проходит, если нет отказов
# и балл >= min_score.
criteria:
  price:
    min: 3000          # цена исходника от (руб.)
    max: 60000         # и до — дороже обычно продаётся плохо

  # Хотя бы одно из этих слов обязано встретиться (иначе — отказ).
  must_any:
    - "Все топы => все топы|все топ*|топ* танк*|топов*|топы"
    - "Все десятки => все 10|все десятки|десятки|десяток|все х|все x"
    - "10 lvl => 10 lvl|10 лвл|10 уровн*|10 ур|10-го уровня|х лвл|x lvl|х уровн*|x уровн*|10 левел*"
    - "Chieftain => чифтейн|chieftain|чифт*"
    - "Об. 279 (р) => об 279|объект 279|об279|279 р|279р"
    - "Об. 260 => об 260|объект 260|об260"
    - "Премы => прем* танк*|премы|премов|прем|премиум* танк*|премтанк*"
    - "Наградная техника => наградн* танк*|наградн* техник*|клановая техника|клановые танки"

  # Все эти слова обязаны встретиться. Для WoT не нужно — оставляем пустым.
  must_all: []

  # Стоп-слова: любое совпадение — отказ. Пишите только то, что точно дисквалифицирует.
  exclude:
    - "бан|ban|banned|забанен*|заблокирован*"
    - "без почты|без доступа к почте|почта не выдается|почта не дается"
    - "blitz|блиц"                   # это профиль «большого» WoT
    - "аренда|в аренду|прокачка|буст*|бустинг"   # услуги, а не продажа аккаунта
    - "обмен|только обмен"

  # Регулярные выражения (хотя бы одно должно совпасть, если список не пуст).
  # Для WoT не используем — достаточно слов.
  regex_any: []
  # Исключающие регулярные выражения.
  regex_exclude:
    - "(есть|стоит|имеется|получен|словил)\\s+бан"

  # Числовые правила по полям attributes (имена полей зависят от площадки —
  # посмотрите attributes у найденного объявления в UI). Отсутствующее поле не
  # отклоняет объявление, только помечает «поле X отсутствует».
  numeric: []
  # numeric:
  #   - {field: tanks_10, min: 5}            # не меньше 5 танков X уровня
  #   - {field: battles, min: 10000}

  # «Фишки» — техника, которую выносим в заголовок лота (+0.5 балла за каждую).
  highlights:
    - "Chieftain => chieftain|чифтейн|чифт*|т95 fv4201|t95 fv4201"
    - "Об. 279 (р) => об 279|объект 279|об279|279 р|279р"
    - "Об. 260 => об 260|объект 260|об260"
    - "Об. 907 => об 907|объект 907|об907"
    - "Об. 140 => об 140|объект 140|об140"
    - "Об. 268/4 => об 268 4|объект 268 4|об 268/4|268 4"
    - "E 100 => е 100|е100|e-100"
    - "E 50 M => е 50 м|е50м|e 50m|e50 m"
    - "ИС-7 => ис-7|ис7|ис 7|is-7|is7"
    - "ИС-4 => ис-4|ис4|is-4"
    - "60TP => 60tp|60тр|60 тп|60тп"
    - "Strv 103B => strv|стрв|strv 103|103b"
    - "Kranvagn => kranvagn|крана|кранваген|кран"
    - "Super Conqueror => super conqueror|супер конь|суперконь|супер конкерор|s conq"
    - "WT E 100 => wt e 100|wt e100|вафля|waffentrager|ваффентрагер"
    - "Type 5 => type 5|тайп 5|тип 5 хеви"
    - "Maus => maus|маус"
    - "Leopard 1 => leopard 1|leopard|леопард"
    - "FV4005 => fv4005|fv 4005|бабаха|fv4005 stage ii"
    - "Bourrasque => bourrasque|бурраск|бураск*"
    - "BZ-176 => bz-176|bz176|бз-176|бз 176"
    - "Skorpion G => skorpion|скорпион"
    - "Progetto => progetto|прогетто"
    - "Löwe => lowe|löwe|лев|лёва|лева"
    - "AMX 50 B => amx 50 b|amx 50b|амх 50"
    - "Голда => голд*|gold|золот*"      # золото на счету — тоже фишка

  # Допустимые регионы (RU / EU / NA / ASIA, понимает синонимы: Lesta, Россия, Европа...).
  # Если площадка не определила регион — объявление не отклоняется.
  regions: ["RU"]

  # Минимальный балл для попадания в кандидаты.
  min_score: 1.0

  # Минимум отзывов у продавца (null — не проверять). Поле seller_reviews заполняют источники.
  seller_min_reviews: null

# ------------------------------------------------------------------- наценка --
pricing:
  # mode: percent (цена * (1+percent/100)) | multiplier (цена * multiplier)
  #       | formula (арифметика над price) | tiers (ступени по цене)
  mode: formula
  formula: "price * 2 - 1000"   # 15 000 -> 29 000; 5 000 -> 9 000
  percent: 90.0                 # используется при mode: percent / tiers
  multiplier: 1.9               # используется при mode: multiplier
  tiers: []                     # пример: [{up_to: 10000, percent: 100}, {up_to: 50000, percent: 80}]
  min_margin: 2000              # минимальная наценка в рублях (ниже не опускаемся)
  round_to: 100                 # округление итоговой цены
  round_mode: nearest           # nearest | down | up
  price_ending: null            # напр. 990 -> цена вида 28 990 (после округления)

# --------------------------------------------------------------- шаблон лота --
# Плейсхолдеры: {game} {game_short} {region} {highlights} {highlights_lines}
#   {price} {price_raw} {source_price} {source_title} {source_description}
#   {seller} {source} {profile_name} {currency} {attr[имя_атрибута]}
# Неизвестный плейсхолдер остаётся как есть. Заголовок обрезается до 100 символов.
# Пустой title_ru -> "{game} | {highlights} | {region}", пустой description_ru ->
# встроенный шаблон «нашего стиля». Пустые EN-поля берутся из RU.
lot_template:
  funpay_subcategory_id: null   # узел /lots/{id}/ для публикации (null — тот же, где искали)
  title_ru: "🔥 {game_short} {region} | {highlights} | Полный доступ"
  title_en: "🔥 {game_short} {region} account | {highlights} | Full access"
  description_ru: |
    🔥 {game} ({region}) — топовый аккаунт
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    📦 Что внутри:
    {highlights_lines}

    🛡 Гарантии:
    ✔ Аккаунт проверяется перед передачей
    ✔ Полный доступ — меняете пароль и привязки на свои
    ✔ Поможем с первым входом

    🚚 Условия:
    • Регион: {region}
    • Выдача данных в чате после оплаты, обычно в течение 10–60 минут
    • Состав техники, статистика и привязки — по запросу в чате

    ✉️ Пишите перед покупкой — подтвердим наличие!
  description_en: ""            # пусто — берётся description_ru
  amount: 1                     # количество (у аккаунта всегда 1)
  deactivate_after_sale: true   # снять лот после продажи
  active: true                  # публиковать активным
  # Дополнительные поля формы лота FunPay (имена — из UI -> «Форма лота»).
  # В значениях работают те же плейсхолдеры.
  fields: {}
  # fields:
  #   server: "RU"
