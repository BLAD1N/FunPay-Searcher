# ============================================================================
#  Профиль поиска: League of Legends (Riot) — аккаунты со всеми чемпионами,
#  редкими скинами (Victorious, Prestige, PAX...) и высоким рангом
#  Подробные комментарии к каждому полю — в wot_ru_tops.yaml, полный шаблон
#  со всеми опциями — any_game_cheap_tops.yaml.
# ============================================================================
id: lol
name: "LoL — все чемпионы, редкие скины, ранг"
game: lol
region: null                     # регионы Riot: EUW / EUNE / RU / NA / TR... — ограничьте через regions при необходимости
enabled: false
description: >-
  Аккаунты League of Legends со всеми чемпионами, редкими скинами (Victorious, Prestige,
  PAX, Hextech, Ultimate), большими коллекциями и рангом Diamond+.

sources:
  funpay:
    enabled: true
    subcategory_id: null
    subcategory_ids: []
    game_query: "League of Legends"
    subcategory_query: "Аккаунты"
    server_filter: []              # пример: ["EUW", "EU West"]
    extra_query: {}
    max_items: 500
  lolz:
    enabled: true
    category: riot                 # общая категория Riot (LoL / Valorant)
    params:
      order_by: price_to_up        # документированный параметр
      # lol_region: euw            # регион — проверьте через Параметры
      # level_min: 100             # минимальный уровень — проверьте через Параметры
      # skins_min: 50              # минимум скинов — проверьте через Параметры
    pages: 3
    max_items: 500

criteria:
  price:
    min: 1000
    max: 40000
  # «скины», «чемпионы» по одному не пишем — есть везде. Только «все чемпионы», конкретные редкие скины, ранг.
  must_any:
    - "Все чемпионы => все чемпион*|all champions|all champs|все персонаж*|фулл чемпион*|all champ*|160 чемпион*|165 чемпион*|170 чемпион*|160 champ*|165 champ*|170 champ*"
    - "Victorious => victorious|викториус|победн* скин*|victory skin*"
    - "Prestige => prestige*|престиж*"
    - "Ultimate => ultimate skin*|ультимейт*|ультимативн*|elementalist|элементалист|dj sona|spirit guard|pulsefire ezreal|gun goddess"
    - "Challenger => challenger|челленджер|чаленджер|челлендж*"
    - "Grandmaster => grandmaster|грандмастер|гранд мастер"
    - "Master => master|мастер"
    - "Diamond => diamond|даймонд|алмаз*"
    - "PAX => pax|пакс|pax sivir|pax twisted fate|pax jax"
    - "Редкие скины => riot girl|riot squad|rusty blitz*|black alistar|блэк алистар|king rammus|ufo corki|silver kayle|сильвер кайл|judgment kayle|championship riven|чемпионш* ривен|young ryze|human ryze|medieval twitch|grey warwick|urfwick|урфвик|annie-versary|god fist|rare skin*|редк* скин*|лимитированн* скин*|limited skin*"
    - "Hextech => hextech|хекстек|хекстех|hextech skin*"
    - "Mythic => mythic|мифическ*|mythic essence|мифическ* эссенц*"
    - "Старый аккаунт => season 1|сезон 1|season 2|сезон 2|season 3|сезон 3|с 2010|с 2011|с 2012|с 2013|2010 год*|2011 год*|2012 год*|2013 год*|old account|старый аккаунт|старый акк|олд акк"
    - "Большая коллекция => 100 скин*|150 скин*|200 скин*|300 скин*|400 скин*|500 скин*|100 skin*|150 skin*|200 skin*|300 skin*|500 skin*"
    - "Honor 5 => honor 5|хонор 5|honor level 5|5 хонор|5 уровень чести|честь 5"
    - "Уровень => 500 lvl|lvl 500|500 уровн*|300 lvl|lvl 300|400 lvl|lvl 400|level 500|level 300|level 400|500 лвл|300 лвл|400 лвл"
  must_all: []
  exclude:
    - "забанен*|заблокирован*|banned|в бане|есть бан|стоит бан|словил бан|получил бан|с баном|пермабан|перма бан|permanent* ban*|perma ban"
    - "без почты|без доступа к почте|почта не выдается|почта не дается|без привязки почты|без привязки к почте|почта не привязана|no email|without email|no mail access"
    - "аренда|в аренду|арендовать|прокат|rent|rental|for rent|временн* доступ*|временн* аккаунт*|временное пользование|temporary access"
    - "только обмен|на обмен|обменяю|меняю на|обмен на|trade only|for trade|swap only"
    - "буст|бустинг|boost|boosting|boosted|калибровк*|прокачаю|накрутк*|услуг* прокачк*|elo boost|duo boost|coaching|коучинг"
    - "смурф*|smurf*|unranked smurf|стартов*|starter*|пуст* акк*|fresh account|new account|новый аккаунт|30 lvl*|30 лвл*|lvl 30 only|уровень 30 для ранкеда|для ранкеда"   # пустые/стартовые аккаунты
    - "ботовод*|botted|боттед|набит* ботами|бот акк*|bot account*|ботнут*"
    - "wild rift|вайлд рифт|mobile|мобайл"   # другая игра
    - "rp по курсу|пополнение|top up|топ ап|riot points по курсу"
    - "hardware ban|hwid ban|хвид бан|vanguard ban|бан вангард*"
  regex_any: []
  regex_exclude:
    - '(есть|стоит|имеется|получен|словил|словлен|with|has)\s+(бан|ban)'
  numeric: []
  # numeric:
  #   - {field: lol_skins, min: 50}       # проверьте имя поля через attributes["raw_keys"]
  highlights:
    - "Все чемпионы => все чемпион*|all champions|all champs|все персонаж*|фулл чемпион*|all champ*|160 чемпион*|165 чемпион*|170 чемпион*|160 champ*|165 champ*|170 champ*"
    - "Victorious => victorious|викториус|победн* скин*|victory skin*"
    - "Prestige => prestige*|престиж*"
    - "Ultimate => ultimate skin*|ультимейт*|ультимативн*|elementalist|элементалист|dj sona|spirit guard|pulsefire ezreal|gun goddess"
    - "Challenger => challenger|челленджер|чаленджер|челлендж*"
    - "Grandmaster => grandmaster|грандмастер|гранд мастер"
    - "Master => master|мастер"
    - "Diamond => diamond|даймонд|алмаз*"
    - "PAX => pax|пакс|pax sivir|pax twisted fate|pax jax"
    - "Редкие скины => riot girl|riot squad|rusty blitz*|black alistar|блэк алистар|king rammus|ufo corki|silver kayle|сильвер кайл|judgment kayle|championship riven|чемпионш* ривен|young ryze|human ryze|medieval twitch|grey warwick|urfwick|урфвик|annie-versary|god fist|rare skin*|редк* скин*|лимитированн* скин*|limited skin*"
    - "Hextech => hextech|хекстек|хекстех|hextech skin*"
    - "Mythic => mythic|мифическ*|mythic essence|мифическ* эссенц*"
    - "Старый аккаунт => season 1|сезон 1|season 2|сезон 2|season 3|сезон 3|с 2010|с 2011|с 2012|с 2013|2010 год*|2011 год*|2012 год*|2013 год*|old account|старый аккаунт|старый акк|олд акк"
    - "Большая коллекция => 100 скин*|150 скин*|200 скин*|300 скин*|400 скин*|500 скин*|100 skin*|150 skin*|200 skin*|300 skin*|500 skin*"
    - "Honor 5 => honor 5|хонор 5|honor level 5|5 хонор|5 уровень чести|честь 5"
    - "Высокий уровень => 500 lvl|lvl 500|500 уровн*|300 lvl|lvl 300|400 lvl|lvl 400|level 500|level 300|level 400|500 лвл|300 лвл|400 лвл"
    - "RP => riot points|rp|рп"
    - "Blue Essence => blue essence|синяя эссенц*|синей эссенц*|эссенц*"
    - "Полный доступ => полный доступ|full access|родная почта|native mail|native email|первая почта"
  regions: []
  min_score: 1.0
  seller_min_reviews: null

pricing:
  mode: formula
  formula: "price * 2 - 1000"
  percent: 90.0
  multiplier: 1.9
  tiers: []
  min_margin: 1500
  round_to: 100
  round_mode: nearest
  price_ending: null

lot_template:
  funpay_subcategory_id: null
  title_ru: "🏅 {game} | {highlights} | Полный доступ, смена почты"
  title_en: "🏅 {game} account | {highlights} | Full access"
  description_ru: |
    🏅 {game} — аккаунт с коллекцией скинов
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    📦 Что внутри:
    {highlights_lines}

    🛡 Гарантии магазина:
    ✔ Аккаунт проверяется перед передачей покупателю
    ✔ Полный доступ к Riot — меняете пароль, почту и 2FA на свои
    ✔ Помогаем с первым входом и сменой данных
    ✔ Сделка через FunPay — деньги под защитой площадки

    🚚 Доставка:
    • Регион: {region}
    • Выдача данных в чате после оплаты, обычно 10–60 минут
    • Полный список чемпионов, скинов и ранг — по запросу в чате

    💬 Напишите перед покупкой — подтвердим наличие и ответим на вопросы!
  description_en: ""
  amount: 1
  deactivate_after_sale: true
  active: true
  fields: {}

