# ============================================================================
#  Профиль поиска: Genshin Impact — прокачанные аккаунты (AR 55+, 5★ персонажи)
#  Подробные комментарии к каждому полю — в wot_ru_tops.yaml.
# ============================================================================
id: genshin
name: "Genshin Impact — AR 55+ и 5★"
game: genshin
region: null                     # серверы Europe/America/Asia — ограничиваем через regions при необходимости
enabled: false
description: >-
  Аккаунты Genshin Impact с рангом приключений 55+ и большим числом
  пятизвёздочных персонажей/оружия.

sources:
  funpay:
    enabled: true
    subcategory_id: null
    subcategory_ids: []
    game_query: "Genshin Impact"
    subcategory_query: "Аккаунты"
    server_filter: []              # пример: ["Europe", "Европа"]
    extra_query: {}
    max_items: 500
  lolz:
    enabled: true
    category: mihoyo               # на Lolz Genshin/Honkai в категории mihoyo
    # Имена параметров проверьте в UI -> «Lolz» -> «Параметры» (категория mihoyo).
    params:
      order_by: price_to_up
      # game: genshin              # только Genshin (пример; проверьте имя параметра)
      # genshin_level_min: 55
      # pmin: 1500
      # pmax: 40000
    pages: 3
    max_items: 500

criteria:
  price:
    min: 1500
    max: 40000
  must_any:
    - "AR 55+ => ar 55|ar55|ar 56|ar 57|ar 58|ar 59|ar 60|ar60|ранг 55|ранг 60|55 ранг*|60 ранг*|55 лвл|60 лвл|55 ar|60 ar"
    - "5★ персонажи => 5 звезд*|5 звёзд*|пятизвездочн*|пятизвёздочн*|5 star*|5-star*|легендар*|5 персонаж*|5 зв"
    - "Лимитированные => лимитированн*|limited|лимит*"
    - "C6/R5 => c6|с6|r5|р5|конст*"           # константы/рефайны — признак сильного аккаунта
  must_all: []
  exclude:
    - "бан|ban|banned|забанен*|заблокирован*"
    - "без почты|без доступа к почте|no email"
    - "аренда|в аренду|прокачка|буст*|boost*|фарм*|farm*"
    - "обмен|только обмен"
    - "реролл*|reroll*|стартов*|starter*"   # стартовые аккаунты — не наш сегмент
  # Хотя бы одно: AR 55–60 или явные «5★».
  regex_any:
    - "(?<![a-zа-я])(ar|ранг|ранг приключени[йя]|adventure rank)\\s*[:\\-–—]?\\s*(5[5-9]|60)(?!\\d)"
    - "(?<!\\d)5\\s*[\\*★✦⭐☆]"
    - "(5|пять|пяти)\\s*[\\-\\s]?\\s*(звезд|звёзд|star)"
  regex_exclude: []
  numeric: []
  # numeric:
  #   - {field: genshin_level, min: 55}
  #   - {field: genshin_legendary_count, min: 10}
  highlights:
    - "AR 60 => ar 60|ar60|ранг 60|60 ранг*|60 ar"
    - "AR 55+ => ar 55|ar55|ar 56|ar 57|ar 58|ar 59|ранг 55|55 ранг*|55 ar"
    - "Raiden => raiden|райден|сёгун|сегун|шогун"
    - "Zhongli => zhongli|чжун ли|джун ли|чжунли"
    - "Hu Tao => hu tao|ху тао|хутао"
    - "Ganyu => ganyu|гань юй|ганьюй"
    - "Nahida => nahida|нахида"
    - "Furina => furina|фурина"
    - "Neuvillette => neuvillette|нёвиллет|невиллет"
    - "Arlecchino => arlecchino|арлекино"
    - "Kazuha => kazuha|казуха|кадзуха"
    - "Yelan => yelan|е лань|елань"
    - "Ayaka => ayaka|аяка"
    - "Xiao => xiao|сяо"
    - "Venti => venti|венти"
    - "Eula => eula|эола"
    - "Mavuika => mavuika|мавуика"
    - "Citlali => citlali|ситлали"
    - "Alhaitham => alhaitham|аль-хайтам|альхайтам"
    - "Wriothesley => wriothesley|ризли"
    - "C6 => c6|с6"
    - "R5 => r5|р5"
    - "5★ оружие => 5 оружи*|5★ оружи*|сигнатур*|signature"
    - "Родная почта => родная почта|native mail|полный доступ|full access"
  regions: []
  min_score: 1.0
  seller_min_reviews: null

pricing:
  mode: formula
  formula: "price * 2 - 1000"
  percent: 90.0
  multiplier: 1.9
  tiers: []
  min_margin: 2000
  round_to: 100
  round_mode: nearest
  price_ending: null

lot_template:
  funpay_subcategory_id: null
  title_ru: ""
  title_en: ""
  description_ru: ""
  description_en: ""
  amount: 1
  deactivate_after_sale: true
  active: true
  fields: {}
