# ============================================================================
#  Профиль поиска: Genshin Impact — прокачанные аккаунты (AR 55–60, 5★ персонажи)
#  Подробные комментарии к каждому полю — в wot_ru_tops.yaml, полный шаблон
#  со всеми опциями — any_game_cheap_tops.yaml.
# ============================================================================
id: genshin
name: "Genshin Impact — AR 55+ и 5★"
game: genshin
region: null                     # серверы Europe/America/Asia — ограничивайте через regions при необходимости
enabled: false
description: >-
  Аккаунты Genshin Impact с рангом приключений 55–60, лимитными 5★ персонажами
  (Ху Тао, Райден, Нахида, Фурина, Нёвиллет...), C6/R5 и запасом примогемов.

sources:
  funpay:
    enabled: true
    subcategory_id: null
    subcategory_ids: []
    game_query: "Genshin Impact"
    subcategory_query: "Аккаунты"
    server_filter: []              # пример: ["Europe", "Европа"]
    extra_query: {}
    max_items: 500
  lolz:
    enabled: true
    category: mihoyo               # на Lolz Genshin/Honkai в категории mihoyo
    params:
      order_by: price_to_up        # документированный параметр
      # genshin_level_min: 55      # минимальный AR — проверьте через Параметры
      # legendary_min: 10          # минимум 5★ — проверьте через Параметры
      # genshin_region: eu         # сервер — проверьте через Параметры
    pages: 3
    max_items: 500

criteria:
  price:
    min: 1500
    max: 40000
  # Убраны «лимит*» и «конст*» — слишком общие. Оставлены AR, конкретные 5★ и C6/R5.
  must_any:
    - "AR 55+ => ar 55|ar55|ar 56|ar 57|ar 58|ar 59|ar 60|ar60|ранг 55|ранг 60|55 ранг*|60 ранг*|55 лвл|60 лвл|55 ar|60 ar|ар 55|ар 60|55 ар|60 ар"
    - "5★ персонажи => 5 звезд*|5 звёзд*|пятизвездочн*|пятизвёздочн*|5 star*|5-star*|легендар*|5 персонаж*|5 зв|легов|леги"
    - "Hu Tao => hu tao|ху тао|хутао|хута"
    - "Raiden => raiden|райден|райдэн|сёгун|сегун|шогун"
    - "Nahida => nahida|нахида"
    - "Furina => furina|фурина"
    - "Neuvillette => neuvillette|нёвиллет|невиллет|нёвилет|невилет"
    - "Zhongli => zhongli|чжун ли|джун ли|чжунли"
    - "Ganyu => ganyu|гань юй|ганьюй"
    - "Kazuha => kazuha|казуха|кадзуха"
    - "Yelan => yelan|е лань|елань|йелан"
    - "Arlecchino => arlecchino|арлекино"
    - "Mavuika => mavuika|мавуика"
    - "Xiao => xiao|сяо"
    - "C6 => c6|с6|6 конст*|c6 конст*|шесть конст*"
    - "R5 => r5|р5|5 рефайн*|r5 рефайн*"
  must_all: []
  exclude:
    - "забанен*|заблокирован*|banned|в бане|есть бан|стоит бан|словил бан|получил бан|с баном|пермабан|перма бан|permanent* ban*|perma ban"
    - "без почты|без доступа к почте|почта не выдается|почта не дается|без привязки почты|без привязки к почте|почта не привязана|no email|without email|no mail access|без hoyoverse|без доступа к hoyoverse"
    - "аренда|в аренду|арендовать|прокат|rent|rental|for rent|временн* доступ*|временн* аккаунт*|временное пользование|temporary access"
    - "только обмен|на обмен|обменяю|меняю на|обмен на|trade only|for trade|swap only"
    - "буст|бустинг|boost|boosting|boosted|прокачаю|прокачка на заказ|прокачка аккаунтов|услуг* прокачк*|накрутк*|фарм на заказ|пройду|закрою бездну"
    - "реролл*|reroll*|стартов*|starter*|стартер*|фарм акк*|farm account|новый аккаунт|new account|fresh account"   # стартовые аккаунты — не наш сегмент
    - "пополнение|кристалл* по курсу|донат по курсу|благословение луны по курсу|top up|топ ап"   # услуги доната
  # Хотя бы одно: AR 55–60, явные «5★» или число легендарок.
  regex_any:
    - '(?<![a-zа-я])(ar|ар|ранг|ранг приключени[йя]|adventure rank)\s*[:\-–—]?\s*(5[5-9]|60)(?!\d)'
    - '(?<!\d)5\s*[\*★✦⭐☆]'
    - '(5|пять|пяти)\s*[\-\s]?\s*(звезд|звёзд|star)'
    - '\d+\s*(легендар\w*|лег\b|легов|легами|леги|лимит\w*|limited|5★|пятизв\w*)'
  regex_exclude: []
  numeric: []
  # numeric:
  #   - {field: genshin_level, min: 55}            # проверьте имя поля через attributes["raw_keys"]
  #   - {field: genshin_legendary_count, min: 10}
  highlights:
    - "AR 60 => ar 60|ar60|ранг 60|60 ранг*|60 ar|ар 60|60 ар"
    - "AR 55+ => ar 55|ar55|ar 56|ar 57|ar 58|ar 59|ранг 55|55 ранг*|55 ar|ар 55|55 ар"
    - "Hu Tao => hu tao|ху тао|хутао|хута"
    - "Raiden => raiden|райден|райдэн|сёгун|сегун|шогун"
    - "Nahida => nahida|нахида"
    - "Furina => furina|фурина"
    - "Neuvillette => neuvillette|нёвиллет|невиллет|нёвилет|невилет"
    - "Zhongli => zhongli|чжун ли|джун ли|чжунли"
    - "Ganyu => ganyu|гань юй|ганьюй"
    - "Kazuha => kazuha|казуха|кадзуха"
    - "Yelan => yelan|е лань|елань|йелан"
    - "Arlecchino => arlecchino|арлекино"
    - "Mavuika => mavuika|мавуика"
    - "Citlali => citlali|ситлали"
    - "Alhaitham => alhaitham|аль-хайтам|альхайтам"
    - "Wriothesley => wriothesley|ризли"
    - "Ayaka => ayaka|аяка"
    - "Xiao => xiao|сяо"
    - "Venti => venti|венти"
    - "Eula => eula|эола"
    - "Kinich => kinich|кинич"
    - "Clorinde => clorinde|клоринда"
    - "C6 => c6|с6|6 конст*|c6 конст*"
    - "R5 => r5|р5|5 рефайн*"
    - "5★ оружие => 5 оружи*|5★ оружи*|сигнатур*|signature|сигна"
    - "Примогемы => примогем*|примы|primogem*|камн* истока|крутк*|пулл*|wishes|fates|судьб*"
    - "Welkin => welkin|велкин|благословение луны"
    - "Полный доступ => полный доступ|full access|родная почта|native mail|native email|первая почта"
  regions: []
  min_score: 1.0
  seller_min_reviews: null

pricing:
  mode: formula
  formula: "price * 2 - 1000"
  percent: 90.0
  multiplier: 1.9
  tiers: []
  min_margin: 2000
  round_to: 100
  round_mode: nearest
  price_ending: null

lot_template:
  funpay_subcategory_id: null
  title_ru: "✨ {game} | {highlights} | Полный доступ, смена почты"
  title_en: "✨ {game} account | {highlights} | Full access"
  description_ru: |
    ✨ {game} — прокачанный аккаунт с 5★
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    📦 Что внутри:
    {highlights_lines}

    🛡 Гарантии магазина:
    ✔ Аккаунт проверяется перед передачей покупателю
    ✔ Полный доступ к HoYoverse — меняете пароль и почту на свои
    ✔ Помогаем с первым входом и сменой данных
    ✔ Сделка через FunPay — деньги под защитой площадки

    🚚 Доставка:
    • Сервер: {region}
    • Выдача данных в чате после оплаты, обычно 10–60 минут
    • Полный список персонажей, оружия и скриншоты — по запросу в чате

    💬 Напишите перед покупкой — подтвердим наличие и ответим на вопросы!
  description_en: ""
  amount: 1
  deactivate_after_sale: true
  active: true
  fields: {}

examples:
  positive:
    - "Genshin AR 60, 20 легендарных 5★: Райден C6, Ху Тао"
    - "Геншин ар 58, Нахида, Фурина, Нёвиллет, 15 легов, 10000 примогемов, родная почта"
    - "Genshin Impact account AR 60 Europe: Hu Tao C6, Raiden, Zhongli, 5 star weapon R5"
