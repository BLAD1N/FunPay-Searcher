# ============================================================================
#  Профиль поиска: Valorant — аккаунты со скинами и высоким рангом
#  Подробные комментарии к каждому полю — в wot_ru_tops.yaml.
# ============================================================================
id: valorant
name: "Valorant — скины и ранг"
game: valorant
region: null                     # регионы Riot: EU / NA / AP / BR / KR / TR — ограничьте через regions при необходимости
enabled: false
description: >-
  Аккаунты Valorant с дорогими коллекциями скинов (Reaver, Elderflame, Prime,
  Champions...) и высоким рангом (Immortal/Radiant).

sources:
  funpay:
    enabled: true
    subcategory_id: null
    subcategory_ids: []
    game_query: "Valorant"
    subcategory_query: "Аккаунты"
    server_filter: []              # пример: ["EU", "Европа"]
    extra_query: {}
    max_items: 500
  lolz:
    enabled: true
    category: riot                 # на Lolz аккаунты Riot (Valorant/LoL) — категория riot
    # Имена параметров проверьте в UI -> «Lolz» -> «Параметры» (категория riot).
    params:
      order_by: price_to_up
      # game: valorant             # только Valorant (пример; проверьте имя параметра)
      # valorant_skins_min: 10
      # pmin: 1000
      # pmax: 40000
    pages: 3
    max_items: 500

criteria:
  price:
    min: 1000
    max: 40000
  must_any:
    - "Скины => скин*|skin*|коллекц*|collection|бандл*|bundle*"
    - "Immortal => immortal|иммортал*|имморт*|бессмерт*"
    - "Radiant => radiant|радиант*"
    - "Ascendant => ascendant|асцендент*|асендант*"
    - "Reaver => reaver|ривер"
    - "Elderflame => elderflame|элдерфлейм|элдер*"
    - "Prime => prime|прайм"
    - "Champions => champions|чемпион*"
    - "Glitchpop => glitchpop|глитчпоп"
    - "Sovereign => sovereign|соверен"
    - "Oni => oni"
    - "RGX => rgx|ргх"
    - "Ion => ion|ион"
    - "VP => vp|валорант поинт*|valorant point*"
  must_all: []
  exclude:
    - "бан|ban|banned|забанен*|заблокирован*"
    - "без почты|без доступа к почте|no email"
    - "аренда|в аренду|буст*|boost*|калибровк*"
    - "обмен|только обмен"
    - "смурф*|smurf*|чист* аккаунт*|пуст* аккаунт*|fresh account"   # пустые аккаунты — не наш сегмент
  regex_any: []
  regex_exclude: []
  numeric: []
  # numeric:
  #   - {field: valorant_skins, min: 10}
  highlights:
    - "Radiant => radiant|радиант*"
    - "Immortal => immortal|иммортал*|имморт*|бессмерт*"
    - "Ascendant => ascendant|асцендент*|асендант*"
    - "Reaver => reaver|ривер"
    - "Elderflame => elderflame|элдерфлейм|элдер*"
    - "Prime => prime|прайм"
    - "Champions => champions|чемпион*"
    - "Glitchpop => glitchpop|глитчпоп"
    - "Sovereign => sovereign|соверен"
    - "Oni => oni"
    - "RGX => rgx|ргх"
    - "Ion => ion|ион"
    - "Spectrum => spectrum|спектрум"
    - "Araxys => araxys|араксис"
    - "Kuronami => kuronami|куронами"
    - "Knife => нож*|knife|melee|мили"
    - "Battle Pass => battle pass|батл пасс|батлпасс|бп"
    - "Родная почта => родная почта|native mail|полный доступ|full access"
  regions: []
  min_score: 1.0
  seller_min_reviews: null

pricing:
  mode: formula
  formula: "price * 2 - 1000"
  percent: 90.0
  multiplier: 1.9
  tiers: []
  min_margin: 2000
  round_to: 100
  round_mode: nearest
  price_ending: null

lot_template:
  funpay_subcategory_id: null
  title_ru: ""
  title_en: ""
  description_ru: ""
  description_en: ""
  amount: 1
  deactivate_after_sale: true
  active: true
  fields: {}
