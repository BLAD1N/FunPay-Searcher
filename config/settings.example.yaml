# ============================================================================
#  FunPay Searcher — настройки приложения
#
#  При первом запуске этот файл копируется в config/settings.yaml — правьте его
#  (settings.yaml не попадает в git). Все значения можно менять и через UI
#  (раздел «Настройки»). Переменные окружения FUNPAY_GOLDEN_KEY и LOLZ_TOKEN,
#  если заданы, имеют приоритет над значениями из файла.
# ============================================================================

funpay:
  # Cookie golden_key с сайта funpay.com — через неё приложение работает от вашего
  # имени (поиск, создание и снятие лотов). Как получить:
  #   1) войдите на https://funpay.com в браузере;
  #   2) откройте DevTools (F12) -> вкладка Application (Chrome) / Storage (Firefox)
  #      -> Cookies -> https://funpay.com;
  #   3) скопируйте значение cookie с именем golden_key (строка из 32 символов).
  # Никому не передавайте это значение — это полный доступ к вашему аккаунту FunPay.
  golden_key: ""

  # User-Agent того же браузера, из которого взята cookie (FunPay сверяет их).
  # Посмотреть: DevTools -> Network -> любой запрос -> Request Headers -> User-Agent,
  # либо просто откройте https://www.whatismybrowser.com/detect/what-is-my-user-agent
  user_agent: ""

  # Прокси для запросов к FunPay (необязательно): http://user:pass@host:port
  proxy: null

  # Пауза между запросами к FunPay, секунды. Меньше 1.0 ставить не рекомендуется —
  # при частых запросах FunPay может временно заблокировать доступ.
  request_delay: 1.5

  # Таймаут одного HTTP-запроса, секунды.
  timeout: 20.0

  # true — создавать наши лоты на FunPay сразу при нажатии «Создать лот» без
  # дополнительного подтверждения. false (по умолчанию) — сначала черновик,
  # который можно проверить и отредактировать, затем публикация вручную.
  auto_publish: false

lolz:
  # Токен API Lolzteam Market. Как получить:
  #   1) откройте https://lolz.team/account/api
  #   2) создайте ключ (API key), в правах (scope) отметьте «Market»;
  #   3) скопируйте токен сюда. Токен действует, пока вы его не отзовёте.
  token: ""

  # Прокси для запросов к api.lzt.market (необязательно): http://user:pass@host:port
  proxy: null

  # Пауза между запросами к API, секунды. Лимит Lolzteam — не чаще 1 запроса
  # в 3 секунды, иначе придёт ошибка 429.
  request_delay: 3.0

  # Таймаут одного HTTP-запроса, секунды.
  timeout: 30.0

monitor:
  # Мониторинг исходных объявлений: проверяем, что аккаунт ещё продаётся.
  enabled: true

  # Как часто проверять доступность исходников (минуты).
  interval_minutes: 30

  # true — автоматически снимать наш лот с публикации, если исходное объявление
  # продано или удалено (чтобы не продать то, чего уже нет).
  auto_deactivate: true

  # Автопоиск по всем включённым профилям раз в N минут. 0 — выключено
  # (поиск запускается только вручную кнопкой в UI).
  auto_search_minutes: 0

  # Как часто проверять новые заказы (продажи наших лотов) на FunPay, минуты. 0 — выключено.
  orders_check_minutes: 5

  # Автоподнятие наших лотов на FunPay раз в N часов (кнопка «Поднять» на сайте). 0 — выключено.
  auto_raise_hours: 4.0

telegram:
  # Уведомления в Telegram: новые подходящие аккаунты, проданные исходники, новые заказы.
  enabled: false

  # Токен бота — создайте бота у @BotFather и вставьте токен сюда.
  bot_token: ""

  # Ваш chat_id (узнать у @userinfobot) или id группы/канала, куда бот добавлен.
  chat_id: ""

  notify_new_candidates: true   # новые подходящие аккаунты после поиска
  notify_source_sold: true      # исходник продан/снят — наш лот деактивирован
  notify_new_orders: true       # новый заказ (продажа) нашего лота на FunPay
  notify_errors: true           # ошибки авторизации/публикации

ui:
  # Адрес и порт локального веб-интерфейса. Оставьте 127.0.0.1, чтобы интерфейс
  # был доступен только с этого компьютера.
  host: 127.0.0.1
  port: 8787

  # Открывать браузер автоматически при запуске.
  open_browser: true

  # Название в шапке интерфейса.
  brand: "FunPay Searcher"

# Валюта по умолчанию для цен в профилях и лотах.
default_currency: RUB
